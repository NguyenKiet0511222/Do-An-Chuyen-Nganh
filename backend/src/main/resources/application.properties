spring.application.name=backend
server.port=${SERVER_PORT:8080}

# ==========================================
# Database Configuration
# Mặc định dùng H2 (tương thích MSSQL) cho môi trường dev khi chưa cấu hình DB_URL.
# Khi kết nối SQL Server thật: thiết lập DB_URL=jdbc:sqlserver://localhost:1433;databaseName=nongsan_db;encrypt=true;trustServerCertificate=true
# hoặc tạo application-local.properties (xem file .example) và chạy với profile "local".
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nongsan?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Upload ảnh sản phẩm
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Swagger / OpenAPI -> http://localhost:8080/swagger-ui hoặc /swagger-ui.html
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ==========================================
# Cấu hình riêng của hệ thống (map vào AppProperties)
# ==========================================
# JWT ký bằng HS256 -> secret phải >= 32 ký tự. Giá trị mặc định CHỈ dùng cho dev.
app.jwt.secret=${JWT_SECRET:nhom5-dev-secret-change-me-in-production-0123456789abcdef}
# Hạn access token (phút). Tài liệu api.md: 24 giờ (1440 phút).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Đăng nhập Google: OAuth Client ID trên Google Cloud Console. Để trống -> /api/auth/google trả 503.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Tài khoản ADMIN đầu tiên, tự tạo khi khởi động nếu chưa có ADMIN nào (AdminSeeder).
app.admin.email=${ADMIN_EMAIL:admin@nongsan.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.full-name=${ADMIN_FULL_NAME:Quan tri vien}

# AI service (Python FastAPI). Backend gọi sang đây; frontend KHÔNG gọi thẳng.
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
# Ngưỡng tin cậy: >= ngưỡng -> tự chấp nhận nhãn AI; < ngưỡng -> đưa vào hàng chờ admin kiểm định
app.ai.auto-accept-threshold=${AI_AUTO_ACCEPT_THRESHOLD:0.85}

# CORS cho frontend Vite (nhiều origin cách nhau bởi dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
