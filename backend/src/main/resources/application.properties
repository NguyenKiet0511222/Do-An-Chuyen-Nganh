spring.application.name=backend
server.port=${SERVER_PORT:8080}

# ==========================================
# Database: SQL Server (chính thức của nhóm — xem docs/api.md mục 0.1)
# Tạo DB + bảng bằng script trong resources/db/ trước khi chạy, hoặc để ddl-auto=update tự tạo.
# Mật khẩu/user thật đặt trong application-local.properties (đã gitignore, xem file .example),
# chạy với profile "local"; hoặc đặt biến môi trường DB_URL/DB_USERNAME/DB_PASSWORD.
# ==========================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=nongsan_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Upload ảnh sản phẩm
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Thư mục lưu ảnh (tương đối theo thư mục chạy backend). Ảnh trả về dạng /uploads/..., giới hạn 5 MB/ảnh kiểm tra trong code.
app.upload.dir=${UPLOAD_DIR:uploads}

# ==========================================
# Swagger / OpenAPI -> http://localhost:8080/swagger-ui (tự chuyển sang /swagger-ui/index.html; /swagger-ui.html KHÔNG dùng được)
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ==========================================
# Cấu hình riêng của hệ thống (map vào AppProperties)
# ==========================================
# JWT ký bằng HS256 -> secret phải >= 32 ký tự. Giá trị mặc định CHỈ dùng cho dev.
app.jwt.secret=${JWT_SECRET:nhom5-dev-secret-change-me-in-production-0123456789abcdef}
# Hạn access token (phút). Tài liệu api.md: 24 giờ (1440 phút).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Đăng nhập Google: OAuth Client ID trên Google Cloud Console. Để trống -> /api/auth/google trả 503.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Tài khoản ADMIN đầu tiên, tự tạo khi khởi động nếu chưa có ADMIN nào (AdminSeeder).
app.admin.email=${ADMIN_EMAIL:admin@nongsan.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.full-name=${ADMIN_FULL_NAME:Quan tri vien}

# AI service (Python FastAPI). Backend gọi sang đây; frontend KHÔNG gọi thẳng.
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
# false -> không gọi AI, mọi ảnh mới vào hàng chờ admin (test H2 đặt false). AI tắt/lỗi KHÔNG chặn đăng sản phẩm.
app.ai.enabled=${AI_ENABLED:true}
# 2 ngưỡng tin cậy (docs/1910.md mục 1): AI = tươi và >= auto-accept -> tự chấp nhận; < review -> UNCERTAIN;
# còn lại (tươi giữa 2 ngưỡng, mọi ảnh hỏng) -> hàng chờ admin. Đây là giá trị mặc định khi bảng settings chưa có.
app.ai.auto-accept-threshold=${AI_AUTO_ACCEPT_THRESHOLD:0.90}
app.ai.review-threshold=${AI_REVIEW_THRESHOLD:0.70}
# Thời gian chờ AI trả lời (ms). Quá hạn -> coi như AI lỗi, ảnh vào hàng chờ admin.
app.ai.timeout-ms=${AI_TIMEOUT_MS:5000}

# CORS cho frontend Vite (nhiều origin cách nhau bởi dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Phí ship cố định mỗi đơn (VND), mỗi shop 1 đơn (api.md mục 3.4). Phải có giá trị, nếu không AppProperties.order() = null.
app.order.shipping-fee-flat=${SHIPPING_FEE_FLAT:20000}
