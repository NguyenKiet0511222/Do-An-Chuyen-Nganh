# Profile "test": chay tren H2 in-memory
spring.datasource.url=jdbc:h2:mem:nongsan_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Ảnh upload khi test ghi vào thư mục tạm, không làm bẩn repo
app.upload.dir=${java.io.tmpdir}/nhom5-test-uploads
# Test không gọi AI service thật (docs/1910.md mục 6): ảnh mới luôn vào hàng chờ admin.
# Test cần kết quả AI thì mock AiServiceClient (@MockitoBean), xem SellerProductAiFlowTest.
app.ai.enabled=false

